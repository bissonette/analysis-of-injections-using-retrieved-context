[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxauth"
version = "0.1.0"
description = "Контроль полномочий retrieved-контекста для защиты RAG от косвенных инъекций указаний (ВКР)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
dense = ["sentence-transformers>=2.2"]
dev = ["pytest>=7"]

[project.scripts]
ctxauth = "ctxauth.cli:main"

[tool.setuptools.packages.find]
include = ["ctxauth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
